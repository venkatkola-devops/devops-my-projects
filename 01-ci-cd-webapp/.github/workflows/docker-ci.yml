name: Docker CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r 01-ci-cd-webapp/requirements.txt

      - name: Run tests
        run: |
          pytest 01-ci-cd-webapp
name: Docker CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t webapp-ci-cd .

      - name: Test Docker container
        run: docker run --rm webapp-ci-cd python -c "print('Container ran successfully')"

