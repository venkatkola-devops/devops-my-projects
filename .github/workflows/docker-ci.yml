name: Docker CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Build Docker image
      run: docker build -t webapp-ci-cd .

    - name: Run container and test
      run: |
        docker run -d --name test-container -p 5000:5000 webapp-ci-cd
        sleep 5
        curl -f http://localhost:5000 || exit 1
        docker stop test-container
        docker rm test-container
